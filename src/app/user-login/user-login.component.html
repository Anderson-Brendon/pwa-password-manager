<header class="d-flex flex-column justify-content-around align-items-center">
    <h1 class="fs-3 text-white">Gerenciador de senhas PWA</h1>
    <img class="col-5 col-md-3 col-lg-2" src="images/passwordkey.svg" alt="">
</header>
<section class="d-flex flex-column align-items-center mt-5">
    <mat-form-field>
        <label class="text-center">{{dbExists() ? 'Insira chave-mestre' : 'Crie chave-mestre'}} <svg matTooltipPosition="above" matTooltip="Esta é a chave que descriptografa informações das suas contas" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg></label>
        <input matInput type="text" [(ngModel)]="masterKey">
    </mat-form-field>
    @if(this.masterKey.length >= 8){
        <button class="scale-in-center" mat-fab extended (click)="tryLogin()">Confirmar</button>
    }
    @if(masterKey != '' && masterKey.length < 8){
        <p class="mt-3">A chave precisa ter no mínimo 8 caracteres</p>
    }
</section>
<div class="d-flex justify-content-around mt-3">
    <button mat-button (click)="openDialogAboutApp()"><span>Sobre o app</span><img src="icons/info.svg"></button>
</div>
